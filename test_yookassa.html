<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование ЮKassa API</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        
        .panel {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-weight: 600;
            color: #555;
        }
        
        input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            margin: 5px 0;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: linear-gradient(to right, #4CAF50, #45a049);
        }
        
        .btn-danger {
            background: linear-gradient(to right, #f44336, #d32f2f);
        }
        
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .token-display {
            background: #f8f9fa;
            border: 1px dashed #667eea;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-top: 10px;
            color: #666;
        }
        
        .plans-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .plan-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
        }
        
        .plan-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }
        
        .plan-card.selected {
            border-color: #4CAF50;
            background-color: #f1f8e9;
        }
        
        .plan-title {
            font-weight: 700;
            font-size: 18px;
            color: #333;
        }
        
        .plan-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }
        
        .plan-description {
            color: #666;
            font-size: 14px;
        }
        
        .payment-frame {
            width: 100%;
            height: 600px;
            border: 2px solid #667eea;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        
        .logs {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            height: 500px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }
        
        .log-time {
            color: #6a9955;
        }
        
        .log-method {
            color: #569cd6;
        }
        
        .log-success {
            color: #4CAF50;
        }
        
        .log-error {
            color: #f44336;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-active {
            background-color: #4CAF50;
        }
        
        .status-inactive {
            background-color: #f44336;
        }
        
        .subscription-info {
            background: #e8f4fd;
            border: 1px solid #bbdefb;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .auto-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .checkbox {
            width: 18px;
            height: 18px;
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>🧪 Тестирование ЮKassa API</h1>
    
    <div class="container">
        <!-- Левая панель: Аутентификация и управление -->
        <div class="panel">
            <h2>🔐 Аутентификация</h2>
            
            <div class="auth-form">
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="test@example.com" value="test@example.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" placeholder="Пароль" value="securepassword123">
                </div>
                
                <div class="btn-group">
                    <button class="btn" onclick="register()">Регистрация</button>
                    <button class="btn btn-secondary" onclick="login()">Войти</button>
                </div>
            </div>
            
            <div id="tokenSection" style="display: none;">
                <h3>Текущий токен:</h3>
                <div id="tokenDisplay" class="token-display"></div>
                <button class="btn btn-danger" onclick="clearToken()" style="margin-top: 10px;">Очистить токен</button>
            </div>
            
            <h2 style="margin-top: 30px;">👤 Пользователь</h2>
            <button class="btn" onclick="getUserInfo()" style="width: 100%;">/api/user/me</button>
            
            <h2 style="margin-top: 30px;">📋 Планы подписки</h2>
            <button class="btn" onclick="getPlans()" style="width: 100%; margin-bottom: 15px;">/api/subscription/plans</button>
            
            <div id="plansContainer" class="plans-container"></div>
            
            <h2 style="margin-top: 30px;">💳 Оплата</h2>
            <button class="btn" onclick="createPayment()" style="width: 100%;" id="createPaymentBtn" disabled>Создать платеж (выберите план)</button>
            
            <div id="paymentFrameContainer" style="display: none;">
                <h3>Оплата через ЮKassa:</h3>
                <iframe id="paymentFrame" class="payment-frame"></iframe>
                <button class="btn btn-danger" onclick="closePaymentFrame()" style="margin-top: 10px;">Закрыть окно оплаты</button>
            </div>
        </div>
        
        <!-- Правая панель: Логи и статус -->
        <div class="panel">
            <h2>📊 Статус подписки</h2>
            <button class="btn" onclick="checkSubscription()">Проверить подписку</button>
            
            <div class="auto-check">
                <input type="checkbox" id="autoCheck" class="checkbox" onchange="toggleAutoCheck()">
                <label for="autoCheck">Автопроверка каждые 5 секунд</label>
            </div>
            
            <div id="subscriptionStatus" class="subscription-info" style="display: none;">
                <!-- Сюда будет вставлен статус подписки -->
            </div>
            
            <h2 style="margin-top: 30px;">📝 Логи запросов</h2>
            <div class="logs" id="logs"></div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn" onclick="clearLogs()">Очистить логи</button>
                <button class="btn btn-secondary" onclick="testAll()">Пройти полный тест</button>
            </div>
        </div>
    </div>
    
    <script>
        // Конфигурация
        const API_BASE_URL = 'http://192.168.31.246:8080';
        let currentToken = localStorage.getItem('jwt_token');
        let selectedPlanId = null;
        let autoCheckInterval = null;
        
        // Элементы DOM
        const logsElement = document.getElementById('logs');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const tokenSection = document.getElementById('tokenSection');
        const plansContainer = document.getElementById('plansContainer');
        const createPaymentBtn = document.getElementById('createPaymentBtn');
        const paymentFrameContainer = document.getElementById('paymentFrameContainer');
        const paymentFrame = document.getElementById('paymentFrame');
        const subscriptionStatus = document.getElementById('subscriptionStatus');
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            if (currentToken) {
                showToken();
            }
            getPlans();
        });
        
        // ========================
        // Логирование
        // ========================
        
        function log(message, type = 'info') {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            logEntry.innerHTML = `
                <span class="log-time">[${timeString}]</span>
                <span class="log-${type}">${message}</span>
            `;
            
            logsElement.appendChild(logEntry);
            logsElement.scrollTop = logsElement.scrollHeight;
        }
        
        function clearLogs() {
            logsElement.innerHTML = '';
            log('Логи очищены', 'info');
        }
        
        // ========================
        // Работа с токеном
        // ========================
        
        function showToken() {
            tokenDisplay.textContent = currentToken || 'Токен отсутствует';
            tokenSection.style.display = 'block';
            createPaymentBtn.disabled = false;
        }
        
        function clearToken() {
            currentToken = null;
            localStorage.removeItem('jwt_token');
            tokenSection.style.display = 'none';
            createPaymentBtn.disabled = true;
            log('Токен очищен', 'info');
        }
        
        // ========================
        // API вызовы
        // ========================
        
        async function apiCall(endpoint, method = 'GET', body = null, requiresAuth = false) {
            const url = `${API_BASE_URL}${endpoint}`;
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                },
            };
            
            if (requiresAuth && currentToken) {
                options.headers['Authorization'] = `Bearer ${currentToken}`;
            }
            
            if (body) {
                options.body = JSON.stringify(body);
            }
            
            log(`${method} ${endpoint}`, 'method');
            
            try {
                const response = await fetch(url, options);
                const data = await response.json();
                
                log(`Ответ: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    return { success: true, data };
                } else {
                    return { success: false, data, status: response.status };
                }
            } catch (error) {
                log(`Ошибка: ${error.message}`, 'error');
                return { success: false, error: error.message };
            }
        }
        
        // ========================
        // Аутентификация
        // ========================
        
        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Введите email и пароль');
                return;
            }
            
            const result = await apiCall('/api/auth/register', 'POST', { email, password });
            
            if (result.success) {
                log(`✅ Регистрация успешна: ${result.data.email}`, 'success');
                alert('Регистрация успешна! Теперь войдите в систему.');
            } else {
                log(`❌ Ошибка регистрации: ${result.data?.message}`, 'error');
                alert(`Ошибка: ${result.data?.message}`);
            }
        }
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Введите email и пароль');
                return;
            }
            
            const result = await apiCall('/api/auth/login', 'POST', { email, password });
            
            if (result.success && result.data.token) {
                currentToken = result.data.token;
                localStorage.setItem('jwt_token', currentToken);
                showToken();
                log(`✅ Вход успешен. Токен сохранен`, 'success');
                alert('Вход успешен!');
            } else {
                log(`❌ Ошибка входа: ${result.data?.message}`, 'error');
                alert(`Ошибка: ${result.data?.message}`);
            }
        }
        
        // ========================
        // Пользователь
        // ========================
        
        async function getUserInfo() {
            if (!currentToken) {
                alert('Сначала войдите в систему');
                return;
            }
            
            const result = await apiCall('/api/user/me', 'GET', null, true);
            
            if (result.success) {
                log(`✅ Информация о пользователе получена: ${JSON.stringify(result.data)}`, 'success');
                alert(`ID: ${result.data.user.id}\nEmail: ${result.data.user.email}`);
            } else {
                log(`❌ Ошибка: ${result.data?.error || 'Неизвестная ошибка'}`, 'error');
            }
        }
        
        // ========================
        // Планы подписки
        // ========================
        
        async function getPlans() {
            const result = await apiCall('/api/subscription/plans', 'GET');
            
            if (result.success) {
                displayPlans(result.data);
                log(`✅ Получено планов: ${result.data.length}`, 'success');
            } else {
                log(`❌ Ошибка получения планов`, 'error');
            }
        }
        
        function displayPlans(plans) {
            plansContainer.innerHTML = '';
            
            plans.forEach(plan => {
                const planCard = document.createElement('div');
                planCard.className = 'plan-card';
                planCard.dataset.planId = plan.id;
                
                planCard.innerHTML = `
                    <div class="plan-title">${plan.name}</div>
                    <div class="plan-price">${(plan.priceAmount / 100).toFixed(2)} ${plan.priceCurrency}</div>
                    <div class="plan-description">${plan.description || 'Без описания'}</div>
                    <div style="margin-top: 10px; font-size: 14px; color: #666;">
                        Длительность: ${plan.durationDays} дней
                    </div>
                `;
                
                planCard.addEventListener('click', () => selectPlan(plan.id));
                plansContainer.appendChild(planCard);
            });
        }
        
        function selectPlan(planId) {
            // Снять выделение со всех карточек
            document.querySelectorAll('.plan-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Выделить выбранную
            const selectedCard = document.querySelector(`[data-plan-id="${planId}"]`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
                selectedPlanId = planId;
                createPaymentBtn.disabled = false;
                log(`📋 Выбран план ID: ${planId}`, 'info');
            }
        }
        
        // ========================
        // Оплата
        // ========================
        
        async function createPayment() {
            if (!currentToken) {
                alert('Сначала войдите в систему');
                return;
            }
            
            if (!selectedPlanId) {
                alert('Выберите план подписки');
                return;
            }
            
            const result = await apiCall('/api/payment/create', 'POST', { planId: selectedPlanId }, true);
            
            if (result.success && result.data.confirmationUrl) {
                log(`✅ Платеж создан. URL для оплаты: ${result.data.confirmationUrl}`, 'success');
                
                // Показываем iframe с формой оплаты ЮKassa
                paymentFrame.src = result.data.confirmationUrl;
                paymentFrameContainer.style.display = 'block';
                paymentFrame.style.display = 'block';
                
                // Начинаем автопроверку статуса
                startAutoCheck();
                
                alert('Переходим к оплате... Откроется окно ЮKassa.');
            } else {
                log(`❌ Ошибка создания платежа: ${result.data?.message}`, 'error');
                alert(`Ошибка: ${result.data?.message}`);
            }
        }
        
        function closePaymentFrame() {
            paymentFrameContainer.style.display = 'none';
            paymentFrame.style.display = 'none';
            paymentFrame.src = '';
            log('Окно оплаты закрыто', 'info');
        }
        
        // ========================
        // Проверка подписки
        // ========================
        
        async function checkSubscription() {
            if (!currentToken) {
                alert('Сначала войдите в систему');
                return;
            }
            
            const result = await apiCall('/api/user/subscription', 'GET', null, true);
            
            if (result.success) {
                displaySubscriptionStatus(result.data);
                log(`✅ Статус подписки получен`, 'success');
            } else {
                log(`❌ Ошибка проверки подписки: ${result.data?.message}`, 'error');
                subscriptionStatus.innerHTML = `<p style="color: #f44336;">Ошибка: ${result.data?.message}</p>`;
                subscriptionStatus.style.display = 'block';
            }
        }
        
        function displaySubscriptionStatus(data) {
            if (data.hasActiveSubscription && data.subscription) {
                const sub = data.subscription;
                subscriptionStatus.innerHTML = `
                    <h3 style="color: #4CAF50; margin-bottom: 15px;">
                        <span class="status-indicator status-active"></span>
                        Подписка активна!
                    </h3>
                    <p><strong>План:</strong> ${sub.planName}</p>
                    <p><strong>Статус:</strong> ${sub.status}</p>
                    <p><strong>Начало:</strong> ${sub.startDate ? new Date(sub.startDate).toLocaleString() : 'Не указано'}</p>
                    <p><strong>Окончание:</strong> ${new Date(sub.endDate).toLocaleString()}</p>
                    <p><strong>Активна:</strong> ${sub.isActive ? 'Да' : 'Нет'}</p>
                `;
            } else {
                subscriptionStatus.innerHTML = `
                    <h3 style="color: #f44336; margin-bottom: 15px;">
                        <span class="status-indicator status-inactive"></span>
                        Подписка не активна
                    </h3>
                    <p>${data.message || 'У вас нет активной подписки'}</p>
                `;
            }
            
            subscriptionStatus.style.display = 'block';
        }
        
        // ========================
        // Автопроверка
        // ========================
        
        function toggleAutoCheck() {
            const autoCheckBox = document.getElementById('autoCheck');
            
            if (autoCheckBox.checked) {
                startAutoCheck();
            } else {
                stopAutoCheck();
            }
        }
        
        function startAutoCheck() {
            if (autoCheckInterval) {
                clearInterval(autoCheckInterval);
            }
            
            autoCheckInterval = setInterval(() => {
                if (currentToken) {
                    checkSubscription();
                }
            }, 5000); // Каждые 5 секунд
            
            log('Автопроверка статуса подписки включена (каждые 5 сек)', 'info');
        }
        
        function stopAutoCheck() {
            if (autoCheckInterval) {
                clearInterval(autoCheckInterval);
                autoCheckInterval = null;
                log('Автопроверка статуса подписки выключена', 'info');
            }
        }
        
        // ========================
        // Тестирование всего флоу
        // ========================
        
        async function testAll() {
            log('🚀 Начинаем полное тестирование...', 'info');
            
            // 1. Регистрация
            const email = `test${Date.now()}@example.com`;
            const password = 'test123';
            
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            
            await register();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // 2. Вход
            await login();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // 3. Получение планов
            await getPlans();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // 4. Выбор первого плана
            const firstPlanCard = document.querySelector('.plan-card');
            if (firstPlanCard) {
                const planId = firstPlanCard.dataset.planId;
                selectPlan(planId);
                log(`Автоматически выбран план ID: ${planId}`, 'info');
                
                // 5. Создание платежа
                await new Promise(resolve => setTimeout(resolve, 1000));
                await createPayment();
                
                log('✅ Полное тестирование завершено. Перейдите к оплате в открывшемся окне.', 'success');
            } else {
                log('❌ Не удалось найти планы для тестирования', 'error');
            }
        }
    </script>
</body>
</html>
